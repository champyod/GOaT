name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Install Tauri CLI
        run: bun install

      - name: Install Rust toolchain (all macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
        if: matrix.platform == 'macos-latest'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps — see GOaT_LECTURE.md §10.2; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync

      # ubuntu-22.04 ships pipewire 0.3.48, whose headers lack the SPA symbols
      # libspa-sys 0.10.1 binds against (spa_meta_region_is_valid, spa_meta_first,
      # spa_video_info_raw.flags). The upstream PPA carries PipeWire 1.x, which has
      # them, so the repo is added before apt-get update to refresh the index.
      - name: Install Linux build dependencies
        run: |
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
        if: matrix.platform == 'ubuntu-22.04'

      - name: Regenerate icons
        run: bun run tauri icon icon.png

      # externalBin requires binaries/tesseract-ocr-<triple> and that directory
      # is gitignored, so every runner has to build the sidecar itself before the
      # bundler below runs. shell: bash is explicit because Windows runners
      # default run: to PowerShell, which cannot execute this script.
      # matrix.args reaches build.sh deliberately unquoted, so the empty field the
      # non-macOS rows carry leaves the command with no argument at all.
      - name: Build OCR sidecar
        shell: bash
        run: bash sidecar-ocr/build.sh ${{ matrix.args }}

      # The bundles copy `resources` (tauri.conf.json) out of models/, which is
      # gitignored, so every runner fetches the published conversion before the
      # bundler below runs. Needs a repo secret HF_TOKEN with read access.
      - name: Fetch NLLB model
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python -m huggingface_hub.cli.hf download CCYod/GOaT-nllb-1.3B-ct2-int8 --local-dir models/nllb-200-distilled-1.3B-ct2-int8

      # beforeBundleCommand is too late: the goat crate build script resolves the
      # `resources` bundle key while compiling, so staging has to be a step of its
      # own ahead of the build. cwd is the repo root, same as beforeBundleCommand's.
      - name: Stage models for bundling
        shell: bash
        run: bash tools/bundle-resources.sh

      # Signing is intentionally off: the repo holds no TAURI_SIGNING_* or APPLE_*
      # secrets, and passing them as empty strings makes tauri-action attempt a
      # codesign keychain import that then fails (see run 37170825011, macOS row).
      # Re-add the variables here once the secrets actually exist.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: GOaT v__VERSION__
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  notify:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Notify Discord of release
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          payload=$(echo '{}' | jq -c --arg server "$SERVER" --arg repo "$REPO" --arg tag "$TAG" '
            {
              embeds: [{
                title: "GOaT release",
                color: 5814783,
                url: ($server + "/" + $repo + "/releases/tag/" + $tag),
                footer: { text: $tag }
              }]
            }
          ')
          curl -s --fail-with-body -H "Content-Type: application/json" -d "$payload" "${WEBHOOK_URL}"

  # A manual dispatch runs from a branch, so it carries no v* ref and tauri-action has
  # nothing to release under. Minting the tag here, after the matrix is green, is what
  # keeps a red build from ever reaching a published tag; the resulting tag push then
  # starts the run that actually builds the official release. Gated on workflow_dispatch
  # so that second run skips this job instead of re-pushing a tag at itself.
  tag-release:
    needs: [publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin — nothing to mint"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "minted $TAG at $(git rev-parse --short HEAD)"
