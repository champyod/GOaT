name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Install Tauri CLI
        run: bun install

      - name: Install Rust toolchain (all macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
        if: matrix.platform == 'macos-latest'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps — see GOaT_LECTURE.md §10.2; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        if: matrix.platform == 'ubuntu-22.04'

      - name: Regenerate icons
        run: bun run tauri icon icon.png

      # build.sh smoke-tests by running the sidecar it just built, so the x86_64
      # cross-build is executed on macos-latest's arm64 image and needs Rosetta 2
      # to start. Scoped to this one row: the install accepts a licence.
      - name: Install Rosetta 2
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64-apple-darwin')
        run: sudo softwareupdate --install-rosetta --agree-to-license

      # externalBin requires binaries/tesseract-ocr-<triple> and that directory
      # is gitignored, so every runner has to build the sidecar itself before the
      # bundler below runs. shell: bash is explicit because Windows runners
      # default run: to PowerShell, which cannot execute this script.
      # matrix.args has to reach build.sh: macos-latest is an arm64 image, so with
      # the host default both macOS rows would install an aarch64 sidecar and the
      # bundler could not resolve tesseract-ocr-x86_64-apple-darwin for the x86_64
      # row. It is deliberately unquoted, so an empty args field leaves the
      # command with no argument at all. build.sh runs the sidecar it just built,
      # so the x86_64 row needs the Rosetta 2 step above.
      - name: Build OCR sidecar
        shell: bash
        run: bash sidecar-ocr/build.sh ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — set TAURI_SIGNING_PRIVATE_KEY + PASSWORD secrets to enable
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization — set APPLE_* secrets to enable
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: GOaT v__VERSION__
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  notify:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Notify Discord of release
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          payload=$(echo '{}' | jq -c --arg server "$SERVER" --arg repo "$REPO" --arg tag "$TAG" '
            {
              embeds: [{
                title: "GOaT release",
                color: 5814783,
                url: ($server + "/" + $repo + "/releases/tag/" + $tag),
                footer: { text: $tag }
              }]
            }
          ')
          curl -s --fail-with-body -H "Content-Type: application/json" -d "$payload" "${WEBHOOK_URL}"
