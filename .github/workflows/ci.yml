name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Frontend type check
        run: bun run --cwd app check
      - name: Install Tauri CLI
        run: bun install

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Regenerate icons
        run: bun run tauri icon icon.png
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # tesseract-rs only warns when a language is missing from the crate's
      # cache, so a green build can still ship an eng-only binary. This job is
      # the gate that would have caught it: the sidecar's own tests assert both
      # languages are embedded and that init fails loudly without tessdata.
      # The cwd must be the crate root, because cargo discovers .cargo/config.toml
      # from the working directory rather than from --manifest-path, and that
      # file is the only thing setting TESSERACT_EMBED_LANGUAGES.
      - name: Build and test OCR sidecar
        working-directory: sidecar-ocr
        run: |
          bash build.sh
          cargo test --release

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps — see GOaT_LECTURE.md §10.2; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync
      - name: Model smoke test
        working-directory: model
        run: uv run main.py

  build:
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Install Tauri CLI
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync
      - name: Model smoke test
        working-directory: model
        run: uv run main.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Regenerate icons
        run: bun run tauri icon icon.png
      # externalBin requires binaries/tesseract-ocr-<triple>, and that directory
      # is gitignored, so the sidecar has to be built on this runner or the
      # bundler below cannot resolve it.
      - name: Build OCR sidecar
        run: bash sidecar-ocr/build.sh
      - name: Build Tauri app
        run: bun run tauri build
