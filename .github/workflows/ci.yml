name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Frontend type check
        run: bun run --cwd app check
      # svelte-check reads types and never runs a component, so a page that
      # throws on mount, a command the IPC harness does not model, and a broken
      # assertion are all invisible to the step above. jsdom needs no window
      # server, so this needs nothing installed beyond the app's own deps.
      #
      # Vitest's bin is `#!/usr/bin/env node`, so the runner's Node is what
      # executes it. Vitest 5 declares ^22.12.0 || ^24 || >=26, and the
      # ubuntu-latest image (ubuntu-24.04, image 20260920.314.1) ships Node
      # 22.23.2, which clears that floor — hence no setup-node step. When the
      # image default ever drops below it, add setup-node here rather than
      # letting the step fail on the floor instead of on a test.
      - name: Frontend unit tests
        run: bun run --cwd app test --run
      - name: Install Tauri CLI
        run: bun install

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # xcap's wayshot backend links -lgbm, which none of the packages above
          # pull in, so without libgbm-dev the crate fails at link with rust-lld
          # unable to find library -lgbm. The build job installs the same set.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
      - name: Regenerate icons
        run: bun run tauri icon icon.png
      # Tauri's build script resolves externalBin at compile time, so the
      # sidecar binary must exist before clippy (which builds the crate).
      # tesseract-rs only warns when a language is missing from the crate's
      # cache, so a green build can still ship an eng-only binary. This step
      # asserts both languages are embedded and that init fails loudly
      # without tessdata. The cwd must be the crate root, because cargo
      # discovers .cargo/config.toml from the working directory rather than
      # from --manifest-path, and that file is the only thing setting
      # TESSERACT_EMBED_LANGUAGES.
      - name: Build and test OCR sidecar
        working-directory: sidecar-ocr
        run: |
          bash build.sh
          cargo test --release
      # The goat build script resolves the `resources` bundle key while compiling,
      # and tauri.conf.json lists models/ paths that are gitignored, so a plain
      # cargo build of the crate fails on the missing files. tauri-build merges
      # TAURI_CONFIG over the file config, which empties resources for the two
      # compile-only steps below.
      - name: Rust clippy
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # clippy and rustfmt both read the sources without ever building the test
      # harness, so a broken assertion is invisible to them and the next job
      # would still bundle a binary whose unit tests had never been run. This
      # step is the only place the main crate's tests execute.
      - name: Rust unit tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps — see GOaT_LECTURE.md §10.2; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync
      - name: Model smoke test
        working-directory: model
        run: uv run main.py

  build:
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - name: Install frontend deps
        run: bun install --cwd app
      - name: Install Tauri CLI
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12"
      - name: Pin Python 3.12 (3.14 wheels missing for planned ML deps; revisit when model deps land)
        working-directory: model
        run: uv python pin 3.12
      - name: Sync model deps
        working-directory: model
        run: uv sync
      - name: Model smoke test
        working-directory: model
        run: uv run main.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
      - name: Regenerate icons
        run: bun run tauri icon icon.png
      # externalBin requires binaries/tesseract-ocr-<triple>, and that directory
      # is gitignored, so the sidecar has to be built on this runner or the
      # bundler below cannot resolve it.
      - name: Build OCR sidecar
        run: bash sidecar-ocr/build.sh
      # CI has no model weights and must not reach for the ones it would need
      # to bundle: the gitignored models/ paths tauri.conf.json lists do not
      # exist on a fresh checkout, so the bundler fails on them. Emptying
      # resources keeps this a compile-and-bundle-shaped check; the real bundle
      # is release.yml's job, which fetches the model and stages it ahead of the
      # release build. beforeBundleCommand runs before the config merge matters,
      # so it needs GOAT_SKIP_MODEL_STAGE to accept that same decision and skip
      # staging instead of exiting 1 on the missing weights. The bundler reads
      # tauri.conf.json directly and never sees the TAURI_CONFIG merge, so the
      # packaging step is skipped outright here and release.yml builds the real
      # bundle.
      - name: Build Tauri app
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
          GOAT_SKIP_MODEL_STAGE: '1'
        run: bun run tauri build --no-bundle
