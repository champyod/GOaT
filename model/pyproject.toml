[project]
name = "model"
version = "0.1.0"
description = "GOaT model pipeline: offline OCR (PP-OCRv5-mobile / ThaiTrOCR) and MT (NLLB-200 distilled 600M / 1.3B) on CPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.8",
    "scipy>=1.13",
    "jiwer>=3.0",
    "sacrebleu>=2.4",
    "tqdm>=4.66",
    "psutil>=6.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle-gpu==3.2.*",
    "onnxruntime>=1.19",
    "transformers>=4.46",
    "torch==2.7.1",  # pin cu12 track: torch 2.13+ pulls nvidia-nccl-cu13 which collides with paddlepaddle-gpu cu126 in one venv
]
mt = [
    "transformers>=4.46",
    "ctranslate2>=4.4",
    "sentencepiece>=0.2",
    "datasets>=3.0",
    "torch==2.7.1",  # pin cu12 track: torch 2.13+ pulls nvidia-nccl-cu13 which collides with paddlepaddle-gpu cu126 in one venv
]
train = [
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "torch==2.7.1",  # pin cu12 track: torch 2.13+ pulls nvidia-nccl-cu13 which collides with paddlepaddle-gpu cu126 in one venv
    "paddlepaddle-gpu==3.2.*",
    "synthtiger @ git+https://github.com/clovaai/synthtiger.git",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/goat_model"]

[project.scripts]
goat-model = "goat_model:main"

[tool.uv]
# Default `uv sync` installs only base + dev deps (lightweight, CI-safe).
# Heavy ML runtimes are opt-in: `uv sync --extra ocr --extra mt --extra train`.
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddlepaddle" }
